services:
  astro:
    image: node:24-alpine
    container_name: setsetset-astro
    working_dir: /workspace
    command: >
      sh -c "npm -g install pnpm && pnpm install && pnpm --filter @app/astro dev --port ${SERVER_PORT} --host"
    ports:
      - "${SERVER_PORT:-3000}:${SERVER_PORT:-3000}"
    volumes:
      - ./:/workspace
      - pnpm_store:/pnpm/store
      - node_modules:/workspace/node_modules
      # - /workspace/apps/astro/.astro
    tmpfs:
      - /workspace/apps/astro/.astro
    env_file:
      - .env
    stop_grace_period: 1s
    networks:
      - setsetset

networks:
  setsetset:
    name: setsetset

volumes:
  data:
  pnpm_store:
  node_modules:
  media:
